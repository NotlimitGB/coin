apiVersion: v1
kind: Pod
metadata: {name: temp-sql}
spec:
  restartPolicy: Never
  containers:
    - name: sql
      image: dockerhub-user/coin-db-init:lab-v1
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 200m, memory: 128Mi}
