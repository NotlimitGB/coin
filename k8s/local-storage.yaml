apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: coin-local}
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolume
metadata: {name: coin-pxc-master}
spec:
  capacity: {storage: 6Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: coin-local
  local: {path: /data/pxc}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [master]

---
apiVersion: v1
kind: PersistentVolume
metadata: {name: coin-pxc-worker1}
spec:
  capacity: {storage: 6Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: coin-local
  local: {path: /data/pxc}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker1]

---
apiVersion: v1
kind: PersistentVolume
metadata: {name: coin-pxc-worker2}
spec:
  capacity: {storage: 6Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: coin-local
  local: {path: /data/pxc}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker2]
