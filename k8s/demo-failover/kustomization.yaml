apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - backend-service.yaml
  - backend-deployment.yaml
  - frontend-service.yaml
  - frontend-deployment.yaml
configMapGenerator:
  - name: coin-demo-nginx
    files:
      - default.conf.template
generatorOptions:
  disableNameSuffixHash: true
