apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata: {name: cluster1}
spec:
  crVersion: 1.20.0
  secretsName: cluster1-secrets
  tls: {enabled: true}
  updateStrategy: SmartUpdate
  upgradeOptions: {apply: disabled}
  pxc:
    size: 3
    image: percona/percona-xtradb-cluster:8.4.8-8.1
    autoRecovery: true
    resources:
      requests: {cpu: 600m, memory: 1Gi}
      limits: {cpu: '2', memory: 2Gi}
    affinity: {antiAffinityTopologyKey: kubernetes.io/hostname}
    volumeSpec:
      persistentVolumeClaim:
        storageClassName: coin-local
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 6Gi}}
  haproxy: {enabled: false}
  proxysql:
    enabled: true
    size: 2
    image: percona/proxysql2:2.7.3-1.3
    resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits: {cpu: '1', memory: 1Gi}
    affinity: {antiAffinityTopologyKey: kubernetes.io/hostname}
    volumeSpec: {emptyDir: {}}
  pmm: {enabled: false, image: 'percona/pmm-client:3.8.0'}
  logcollector: {enabled: false, image: 'percona/fluentbit:5.0.6-1'}
  users:
    - name: coin
      dbs: [coin]
      hosts: ['%']
      grants: [SELECT, INSERT, UPDATE, DELETE, CREATE]
      passwordSecretRef: {name: coin-db, key: password}
